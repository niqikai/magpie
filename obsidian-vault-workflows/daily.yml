# 将此文件放到 niqikai/Obsidian-Vault 仓库的 .github/workflows/daily.yml
#
# 工作原理：
#   - workflow 运行在 Obsidian-Vault 仓库上下文中
#   - GITHUB_TOKEN 自动拥有该仓库的写权限，无需 PAT
#   - Magpie（公开仓库）被 checkout 到子目录，只读访问
#   - 脚本运行后将生成的文件提 PR 到 main 分支

name: Daily Digest

on:
  schedule:
    - cron: '30 23 * * *'   # UTC 23:30 = 北京时间 07:30
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Obsidian Vault
        uses: actions/checkout@v4
        # 默认 checkout 当前仓库（Obsidian-Vault）到工作目录根

      - name: Checkout Magpie
        uses: actions/checkout@v4
        with:
          repository: niqikai/magpie
          path: _magpie   # 放到子目录，避免污染 vault 根目录

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: _magpie/requirements.txt

      - name: Install dependencies
        run: pip install -r _magpie/requirements.txt

      - name: Run Magpie
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_PATH: .                              # vault 根 = 当前工作目录
          STATE_FILE: .magpie-state.json             # 隐藏文件，跟随 vault 持久化
          MODEL: claude-3-5-sonnet
          MODEL_BASE_URL: https://models.inference.ai.azure.com
        run: python _magpie/main.py

      - name: Create PR if there are new files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="digest/$DATE"

          git config user.name  "Magpie Bot"
          git config user.email "magpie@users.noreply.github.com"

          # 忽略 _magpie 子目录本身
          git checkout -b "$BRANCH"
          git add Daily/ Sources/ .magpie-state.json 2>/dev/null || true

          # 如果没有变化就退出
          git diff --cached --quiet && echo "No new articles today." && exit 0

          COUNT=$(git diff --cached --name-only | grep -c '\.md$' || true)
          git commit -m "digest: $DATE ($COUNT articles)"
          git push origin "$BRANCH"

          gh pr create \
            --title "📰 $DATE 早间简报" \
            --body "由 Magpie 自动生成，共 $COUNT 篇新文章。" \
            --base main \
            --head "$BRANCH"
