name: Daily Digest

on:
  schedule:
    - cron: '30 23 * * *'   # UTC 23:30 = 北京时间 07:30
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Magpie
        uses: actions/checkout@v4

      - name: Checkout Obsidian Vault
        uses: actions/checkout@v4
        with:
          repository: niqikai/Obsidian-Vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Magpie
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAULT_PATH: ./vault
          STATE_FILE: ./vault/.magpie-state.json
          MODEL: claude-haiku-4-5
        run: python main.py

      - name: Create PR to Obsidian Vault
        env:
          GH_TOKEN: ${{ secrets.VAULT_TOKEN }}
        working-directory: vault
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="digest/$DATE"

          git config user.name  "Magpie Bot"
          git config user.email "magpie@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Daily/ Sources/ .magpie-state.json 2>/dev/null || true

          git diff --cached --quiet && echo "No new articles today." && exit 0

          COUNT=$(git diff --cached --name-only | grep -c '\.md$' || true)
          git commit -m "digest: $DATE ($COUNT articles)"
          git push origin "$BRANCH"

          gh pr create \
            --repo niqikai/Obsidian-Vault \
            --title "📰 $DATE 早间简报" \
            --body "由 Magpie 自动生成，共 $COUNT 篇新文章。" \
            --base main \
            --head "$BRANCH"
